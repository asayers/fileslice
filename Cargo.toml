[package]
name = "fileslice"
description = "Slices of files"
version = "0.6.0"
authors = ["Alex Sayers <alex@asayers.com>"]
edition = "2021"
license = "Unlicense"
repository = "https://github.com/asayers/fileslice"

[dependencies]
bytes = { version = "1.11.0", optional = true }
parquet = { version = "57.1.0", default-features = false, optional = true }
tar = { version = "0.4.44", optional = true }

[features]
default = ["parquet", "tar"]
parquet = ["dep:parquet", "dep:bytes"]
tar = ["dep:tar"]
